; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ──────────────────────────────────────────────────────────────────────────────
; Shared base settings (inherited by all environments via `extends = base`)
; ──────────────────────────────────────────────────────────────────────────────
[base]
platform        = ststm32
board           = lora_e5_mini
framework       = arduino
board_build.mcu = stm32wle5jc
monitor_speed   = 115200
lib_deps =
	jgromes/RadioLib@^7.2.0
	stm32duino/STM32duino Low Power@^1.3.0
	paulstoffregen/Time @ ^1.6.1
	stm32duino/STM32duino RTC@^1.6.0
	mikalhart/TinyGPSPlus@^1.1.0
	marzogh/SPIMemory@^3.4.0
monitor_filters =
    colorize
    time

; ──────────────────────────────────────────────────────────────────────────────
; HOW build_src_filter WORKS
; ──────────────────────────────────────────────────────────────────────────────
;  The filter starts from an EMPTY set.
;  +<pattern>  adds   files matching the pattern to the build set.
;  -<pattern>  removes files matching the pattern from the build set.
;  Patterns are applied left-to-right.
;
;  Each variant environment explicitly includes only its own .cpp file, so
;  main.cpp (and the other variant's file) are never compiled.
; ──────────────────────────────────────────────────────────────────────────────

; ──────────────────────────────────────────────────────────────────────────────
; Terrestrial variant — GPS + IMU (LSM6DSL) + SPI Flash
;
; Flash:  pio run -e terrestrial -t upload
; ──────────────────────────────────────────────────────────────────────────────
[env:terrestrial]
extends          = base
build_src_filter = +<terrestrial.cpp>
build_flags =
	-DHAL_RTC_MODULE_ENABLED
	-DHAL_SPI_MODULE_ENABLED

; ──────────────────────────────────────────────────────────────────────────────
; Aquatic variant — MPR121 submersion detection only (no GPS, no Flash, no IMU)
;
; Flash:  pio run -e aquatic -t upload
; ──────────────────────────────────────────────────────────────────────────────
[env:aquatic]
extends          = base
build_src_filter = +<aquatic.cpp>
build_flags =
	-DHAL_RTC_MODULE_ENABLED

; ──────────────────────────────────────────────────────────────────────────────
; Testing variant — exercises every peripheral on both boards in one pass
;
; Flash:  pio run -e testing -t upload
; ──────────────────────────────────────────────────────────────────────────────
[env:testing]
extends          = base
build_src_filter = +<testing.cpp>
build_flags =
	-DHAL_RTC_MODULE_ENABLED
	-DHAL_SPI_MODULE_ENABLED

; ──────────────────────────────────────────────────────────────────────────────
; Radio listener — receive-only monitor, prints decoded packets to Serial
;
; Flash:  pio run -e radio-listener -t upload
; ──────────────────────────────────────────────────────────────────────────────
[env:radio-listener]
extends          = base
build_src_filter = +<radio-listener.cpp>
